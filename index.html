<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supermarket Mapper</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="panel">
    <h1>Supermarket Mapper</h1>
    <form id="search">
      <label>Stores to map
        <input id="stores" type="text" placeholder="Trader Joe's, Aldi, Whole Foods" required>
        <small>Comma-separated chain or store names. Leave as <code>*</code> for every grocery store.</small>
      </label>
      <label>Area
        <input id="area" type="text" placeholder="City, neighborhood, or ZIP code">
      </label>
      <div class="row">
        <label>Radius (km)
          <input id="radius" type="number" min="1" max="50" step="1" value="10">
        </label>
        <button type="button" id="locate" title="Use my current location">📍 Near me</button>
      </div>
      <label class="check"><input id="includeSmall" type="checkbox"> Include convenience &amp; specialty food shops</label>
      <button type="submit" id="go">Map stores</button>
    </form>

    <p id="status" role="status"></p>

    <div id="legend"></div>
    <div id="exports" hidden>
      <button type="button" id="csv">Download CSV</button>
      <button type="button" id="geojson">Download GeoJSON</button>
      <button type="button" id="share">Copy link</button>
    </div>
    <ol id="results"></ol>

    <footer>Data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, via Overpass &amp; Nominatim.</footer>
  </aside>
  <main id="map"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
